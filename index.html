<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --navy: #01335f; --navy-2: #0f4a86; --navy-soft: #e8eef6;
  --teal: #009b9e; --teal-soft: #e0f3f3;
  --coral: #e95f55; --coral-soft: #fdecea;
  --late: #c8362a; --late-soft: #fdebe9;
  --done: #2e9e62; --done-soft: #e5f4ec;
  --doing: #d98a12; --doing-soft: #fdf3e2;
  --bg: #f3f5f9; --panel: #ffffff; --line: #e1e6ee; --line-2: #ccd4e0;
  --text: #13213a; --muted: #687489;
  --p-combo: #e95f55; --p-cresto: #2f5ba8; --p-etc: #009b9e; --p-none: #8a94a6;
  --event-bg: #eef3fa; --event-text: #3b5f8f;
  --radius: 10px;
  --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

/* ---------- 헤더 ---------- */
.top { background: var(--panel); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1440px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand img { height: 46px; width: auto; display: block; }
.brand img.mascot { height: 48px; width: 48px; border-radius: 50%; box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(1,51,95,.18); margin-right: -4px; }
.brand .sep { width: 1px; height: 34px; background: var(--line-2); }
.brand h1 { margin: 0; font-size: 22px; letter-spacing: -0.5px; color: var(--navy); line-height: 1.1; }
.brand h1 small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 3px; }
.top .spacer { flex: 1; }
.sync { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.35; }
.sync b { color: var(--text); font-weight: 600; }
.starbar { height: 4px; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; }
.starbar i:nth-child(1) { background: var(--navy); } .starbar i:nth-child(2) { background: var(--teal); }
.starbar i:nth-child(3) { background: var(--coral); } .starbar i:nth-child(4) { background: var(--teal); }

.btn { border: 1px solid var(--line-2); background: var(--panel); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--navy-2); }
.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.primary:hover { background: var(--navy-2); }
.btn.teal { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.coral { background: var(--coral); border-color: var(--coral); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--late); border-color: #f0c2bd; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .4; cursor: default; }
select.sel { border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 10px; background: var(--panel); font-weight: 600; font-size: 13px; }

/* ---------- 탭 ---------- */
.tabs-wrap { max-width: 1440px; margin: 0 auto; padding: 0 20px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 14px 14px 12px; font-weight: 700; font-size: 15px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--navy); border-bottom-color: var(--coral); }
.tabs button .cnt { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; font-size: 11px; line-height: 18px; background: var(--late); color: #fff; vertical-align: 2px; }
main { max-width: 1440px; margin: 0 auto; padding: 18px 20px 120px; }

/* ---------- 공통 ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.card > h2, .sec-h { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font-size: 11px; font-weight: 700; line-height: 18px; white-space: nowrap; }
.pill.late { background: var(--late); color: #fff; }
.pill.today { background: var(--coral); color: #fff; }
.pill.soon { background: var(--navy-soft); color: var(--navy); }
.pill.gray { background: #eef1f5; color: var(--muted); }
.pill.done { background: var(--done-soft); color: var(--done); }
.pill.event { background: var(--event-bg); color: var(--event-text); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700; color: var(--muted); }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 6px 12px; font-weight: 700; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--navy); color: #fff; }
.label-sm { font-size: 12px; color: var(--muted); font-weight: 600; }
.empty { color: var(--muted); font-size: 13px; padding: 10px 4px; }
.grow { flex: 1; }

/* ---------- 오늘: KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { padding: 18px 22px 16px 24px; position: relative; overflow: hidden; }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--k, var(--navy)); }
.kpi .k-l { font-size: 18px; color: var(--text); font-weight: 800; letter-spacing: -0.3px; }
.kpi .k-v { font-size: 52px; font-weight: 800; letter-spacing: -1.5px; color: var(--k, var(--navy)); line-height: 1.1; margin-top: 6px; }
.kpi .k-v small { font-size: 22px; font-weight: 700; margin-left: 2px; }
.kpi .k-s { font-size: 15px; color: var(--muted); font-weight: 600; margin-top: 4px; }
.bar { height: 9px; background: #edf0f5; border-radius: 999px; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--teal); border-radius: 999px; }
.today-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(360px, 1fr); gap: 16px; align-items: start; }
.sec { margin-bottom: 18px; }
.sec-h { margin: 0 0 8px 2px; }
.sec-h .n { font-size: 12px; color: var(--muted); font-weight: 600; }
.sec-h .act { margin-left: auto; }
.tlist { display: flex; flex-direction: column; gap: 8px; }

/* 업무 카드 */
.task { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--pc, var(--p-none)); border-radius: 9px; padding: 10px 12px 10px 8px; }
.task:hover { border-color: var(--line-2); border-left-color: var(--pc, var(--p-none)); }
.task.late { border-color: #f1b8b2; background: #fffafa; border-left-color: var(--late); }
.task.sel { background: #f2f8ff; border-color: #b8cbe6; }
.task.done { opacity: .7; }
.task.done .t-ttl { text-decoration: line-through; color: var(--muted); }
.task input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--navy); justify-self: center; cursor: pointer; }
.t-main { min-width: 0; cursor: pointer; }
.t-ttl { font-weight: 700; font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
.t-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 3px; }
.t-meta .who { color: var(--text); font-weight: 600; }
.t-meta .prod { font-weight: 700; color: var(--pc); }
.status { border: 0; border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 800; white-space: nowrap; min-width: 64px; }
.status.todo { background: #eef1f5; color: var(--muted); }
.status.doing { background: var(--doing-soft); color: var(--doing); }
.status.done { background: var(--done-soft); color: var(--done); }
.status:hover { filter: brightness(.96); }

/* 오른쪽 */
.side { display: flex; flex-direction: column; gap: 14px; }
.side .card { padding: 18px 20px; }
.side h2 { font-size: 18px; }
.side h2 { margin-bottom: 10px; }
.ev { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; font-weight: 600; }
.ev:first-of-type { border-top: 0; }
.ev .tm { color: var(--event-text); font-weight: 800; min-width: 52px; font-size: 14px; padding-top: 1px; }
.mini { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.mini:first-of-type { border-top: 0; }
.mini .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: line-through; color: var(--muted); }

/* 일괄 처리 바 */
.bulk { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--navy); color: #fff; border-radius: 12px; padding: 10px 12px 10px 18px; display: flex; gap: 10px; align-items: center; box-shadow: 0 10px 30px rgba(1, 51, 95, .35); z-index: 40; }
.bulk b { margin-right: 6px; }
.bulk .btn { border-color: rgba(255,255,255,.35); background: transparent; color: #fff; }
.bulk .btn.teal { background: var(--teal); border-color: var(--teal); }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: #13213a; color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; z-index: 60; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.toast button { background: none; border: 0; color: #7fe0e2; font-weight: 800; margin-left: 10px; }

/* ---------- 캘린더 ---------- */
.cal { overflow: hidden; }
.cal-head { display: flex; align-items: center; gap: 8px; }
.cal-head .lbl { font-size: 19px; font-weight: 800; min-width: 150px; text-align: center; color: var(--navy); }
.dow, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.dow div { padding: 8px; font-size: 12px; color: var(--muted); font-weight: 700; text-align: center; border-bottom: 1px solid var(--line); background: #fafbfd; }
.dow div:first-child, .day.sun .num { color: #cc3b3b; }
.dow div:last-child, .day.sat .num { color: #3b5f8f; }
.day { min-height: 116px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 5px; display: flex; flex-direction: column; gap: 3px; min-width: 0; cursor: pointer; }
.day:nth-child(7n) { border-right: 0; }
.day.out { background: #fafbfd; }
.day.out .num { opacity: .35; }
.day.today { background: #f6fbfb; }
.day .num { font-size: 12px; font-weight: 700; padding: 1px 6px; align-self: flex-start; border-radius: 999px; }
.day.today .num { background: var(--teal); color: #fff; }
.item { display: block; width: 100%; text-align: left; border: 0; border-radius: 5px; padding: 2px 6px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 18px; }
.item.task-i { background: var(--pc); color: #fff; font-weight: 600; }
.item.task-i.late { background: #fff; color: var(--late); box-shadow: inset 0 0 0 1.5px var(--late); font-weight: 700; }
.item.task-i.done { background: var(--done-soft); color: var(--done); text-decoration: line-through; font-weight: 500; }
.item.ev-i { background: var(--event-bg); color: var(--event-text); }
.item .t { opacity: .85; margin-right: 4px; font-weight: 500; }
.more { font-size: 11px; color: var(--muted); padding-left: 6px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.week .col { border-right: 1px solid var(--line); min-height: 440px; padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.week .col:last-child { border-right: 0; }
.week .col.today { background: #f6fbfb; }
.week .hd { font-size: 12px; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; font-weight: 600; }
.week .hd b { font-size: 17px; color: var(--text); margin-right: 4px; }
.week .item { white-space: normal; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

.catbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.cat { border: 1.5px solid var(--line-2); background: #fff; border-radius: 999px; padding: 7px 16px; font-size: 13px; font-weight: 700; color: var(--text); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.cat .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cc); }
.cat:hover { border-color: var(--cc); }
.cat.on { background: var(--cc); border-color: var(--cc); color: #fff; }
.cat.on .dot { background: #fff; }
.sel.sm { padding: 6px 10px; font-size: 13px; }
/* ---------- 개인별 ---------- */
.ppl { overflow-x: auto; }
.ppl table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 980px; table-layout: fixed; }
.ppl th, .ppl td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); vertical-align: top; padding: 8px; }
.ppl th:last-child, .ppl td:last-child { border-right: 0; }
.ppl thead th { background: #fafbfd; font-size: 12px; color: var(--muted); text-align: left; position: sticky; top: 0; }
.ppl thead th.today { color: var(--teal); background: #f0f9f9; }
.ppl thead th b { font-size: 15px; color: var(--text); margin-right: 3px; }
.ppl td.today { background: #f8fcfc; }
.ppl td.who { background: #fafbfd; }
.ppl td.who .nm { font-weight: 800; font-size: 14px; }
.ppl td.who .st { font-size: 12px; color: var(--muted); margin-top: 2px; }
.ppl td.who .st b.l { color: var(--late); }
.ppl td.who.me { background: var(--teal-soft); }
.ppl td.lt { background: #fffafa; }
.ppl .morebtn { border: 0; background: none; color: var(--late); font-size: 12px; font-weight: 700; padding: 2px 0; }
.chipt { display: block; width: 100%; text-align: left; border: 0; border-left: 4px solid var(--pc); background: #f6f8fb; border-radius: 6px; padding: 4px 7px; font-size: 12px; font-weight: 600; margin-bottom: 4px; line-height: 1.35; }
.chipt.late { border-left-color: var(--late); background: var(--late-soft); color: var(--late); }
.chipt.done { color: var(--muted); text-decoration: line-through; background: #f3f5f8; }
.chipe { display: block; font-size: 11px; color: var(--event-text); background: var(--event-bg); border-radius: 5px; padding: 2px 6px; margin-bottom: 4px; }

/* ---------- 아침 브리핑 ---------- */
.brief { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.brief .card { padding: 16px; }
.brief h2 { margin-bottom: 4px; }
.brief .hint { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
.phone { background: #b9cbe0; border-radius: 16px; padding: 14px; }
.brief1 { padding: 16px 18px 18px; }
.bhead { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 12px; }
.bhead .opts { margin: 0; }
.vsep { width: 1px; height: 22px; background: var(--line-2); }
.phone2 { background: #b9cbe0; border-radius: 18px; padding: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 520px)); gap: 24px; justify-content: center; align-items: start; }
.phone2 .bubble { max-width: none; }
.bubble .bh .no { width: 20px; height: 20px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 11px; display: inline-grid; place-items: center; flex: none; }
.phone2 .bubble pre { font-size: 14px; }
.bubble { background: #fff; border-radius: 12px; overflow: hidden; max-width: 340px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.bubble .bh { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 12px; font-weight: 700; }
.bubble .bh img { width: 22px; height: 20px; }
.bubble canvas, .bubble img.prev { width: 100%; display: block; }
.bubble pre { margin: 0; padding: 10px 12px 12px; font: 13px/1.55 var(--font); white-space: pre-wrap; }
.meter { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; margin: 10px 0; }
.meter span b { font-variant-numeric: tabular-nums; }
.meter .ok { color: var(--done); } .meter .bad { color: var(--late); }
textarea.out { width: 100%; min-height: 360px; border: 1px solid var(--line-2); border-radius: 8px; padding: 10px; font: 13px/1.55 var(--font); resize: vertical; }
.steps { margin: 12px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.steps li { margin: 3px 0; }
.opts { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; margin-bottom: 8px; }
.opts label { display: inline-flex; gap: 5px; align-items: center; }
.opts input[type=date] { border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 8px; }

/* ---------- 팝업 ---------- */
.modal { position: fixed; inset: 0; background: rgba(1, 25, 50, .45); display: none; align-items: flex-start; justify-content: center; padding: 48px 16px; z-index: 80; overflow-y: auto; }
.modal.open { display: flex; }
.sheet { background: var(--panel); border-radius: 14px; width: min(580px, 100%); padding: 22px; box-shadow: 0 24px 60px rgba(0,0,0,.25); }
.sheet h3 { margin: 6px 0; font-size: 19px; line-height: 1.35; color: var(--navy); }
.sheet .x { float: right; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--muted); }
.kv { display: grid; grid-template-columns: 84px 1fr; gap: 8px 12px; margin: 14px 0 0; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.form { display: grid; grid-template-columns: 84px 1fr; gap: 9px 12px; align-items: center; margin-top: 12px; }
.form input:not([type=checkbox]), .form select, .form textarea { width: 100%; border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 9px; background: #fff; }
.form .pchk { display: flex; gap: 6px 14px; flex-wrap: wrap; }
.form .pchk label { display: inline-flex; gap: 5px; align-items: center; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.actions .left { margin-right: auto; }
.menu { position: relative; }
.menu .dd { position: absolute; right: 0; top: calc(100% + 6px); background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,.12); padding: 6px; min-width: 210px; z-index: 50; }
.menu .dd button, .menu .dd label { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
.menu .dd button:hover, .menu .dd label:hover { background: var(--bg); }
.menu .dd hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

@media (max-width: 1100px) {
  .today-grid, .brief { grid-template-columns: minmax(0, 1fr); }
  .phone2 { grid-template-columns: 1fr; padding: 12px; gap: 12px; }
  .vsep { display: none; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .top-in { padding: 10px 14px; gap: 10px; }
  .brand img { height: 34px; }
  .brand h1 { font-size: 18px; }
  .brand img.mascot { height: 36px; width: 36px; }
  .sync { display: none; }
  main { padding: 14px 12px 120px; }
  .tabs-wrap { padding: 0 8px; }
  .tabs button { padding: 12px 10px 10px; font-size: 14px; }
  .kpi .k-v { font-size: 38px; }
  .kpi .k-l { font-size: 15px; }
  .kpi .k-s { font-size: 13px; }
  .kpi { padding: 14px 14px 12px 18px; }
  .task { grid-template-columns: 24px minmax(0, 1fr); }
  .task .status { grid-column: 2; justify-self: start; }
  .day { min-height: 62px; padding: 2px; }
  .day .item { font-size: 0; height: 6px; padding: 0; border-radius: 3px; line-height: 6px; }
  .more { display: none; }
  .week { grid-template-columns: 1fr; }
  .week .col { min-height: 0; border-right: 0; border-bottom: 1px solid var(--line); }
  .kv, .form { grid-template-columns: 1fr; gap: 3px 0; }
}
</style>

<script>
// GitHub 공유 페이지: 구글 Apps Script 화면 대신 웹 주소로 시트에 요청한다
const STAR_API = "https://script.google.com/macros/s/AKfycbxb3eeIBllD8NEDkLp6sfYNKA1hJ9VI6Bsb0njMQfN16M034X0-i7DVL1yTeLEz9pUr/exec";
const STAR_KEY = (() => {
  const m = location.hash.match(/k=([A-Za-z0-9_-]{16,})/);
  try { if (m) localStorage.setItem("star-web-key", m[1]); return m ? m[1] : (localStorage.getItem("star-web-key") || ""); } catch (e) { return m ? m[1] : ""; }
})();
(function () {
  const me = () => { try { return (JSON.parse(localStorage.getItem("teamstar-gihan-v2")) || {}).me || ""; } catch (e) { return ""; } };
  const call = (op, args) => fetch(STAR_API, { method: "POST", body: JSON.stringify({ web: op, key: STAR_KEY, who: me(), args: args || {} }) })
    .then(r => r.json()).then(o => { if (!o.ok) throw new Error(o.error || "처리하지 못했습니다"); return o.data; });
  const runner = () => {
    let ok = () => {}, fail = () => {};
    const o = {
      withSuccessHandler(f) { ok = f; return o; }, withFailureHandler(f) { fail = f; return o; },
      getData() { call("data").then(ok, fail); }, getViewData() { call("data").then(ok, fail); },
      updateTask(id, version, fields) { call("update", { id, version, fields }).then(ok, fail); },
      addTask(task) { call("add", { task }).then(ok, fail); },
      deleteTask(id, version) { call("delete", { id, version }).then(ok, fail); },
    };
    return o;
  };
  window.google = { script: { get run() { return runner(); } } };
})();
</script>
<script>
// 실행 방식: EDIT=편집용 배포(시트에 저장, 팀 공유) / RO=열람 전용 배포 / LOCAL=파일로 연 사본 (RO·LOCAL은 이 브라우저에만 저장)
// 열람 전용 배포에서는 서버가 아래 값을 바꿔 내려보낸다
const READ_ONLY = !STAR_KEY;
const HAS_SERVER = typeof google !== "undefined" && google.script && google.script.run;

  const PRODUCTS = ["복합제", "크레스토", "기타"];
  const PCOLOR = { "복합제": "var(--p-combo)", "크레스토": "var(--p-cresto)", "기타": "var(--p-etc)" };
  const PHEX = { "복합제": "#e95f55", "크레스토": "#2f5ba8", "기타": "#009b9e" };
  const DOW = ["일", "월", "화", "수", "목", "금", "토"];
  const STATUS = { todo: "대기", doing: "진행 중", done: "완료" };
  const NEXT = { todo: "doing", doing: "done", done: "todo" };
  const LS = "teamstar-gihan-v2";

  // ---------- 저장소: 이 브라우저에 저장 (JSON 내보내기로 백업, 불러오기로 이동) ----------
  let store = { overrides: {}, added: [], deleted: [], me: "" };
  try { store = Object.assign(store, JSON.parse(localStorage.getItem(LS)) || {}); } catch (e) {}
  const persist = () => { try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {} };

  // ---------- 날짜 ----------
  const pad = n => String(n).padStart(2, "0");
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const now = new Date();
  const todayISO = iso(now);
  const stamp = () => { const d = new Date(); return `${iso(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const fmt = s => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}(${DOW[d.getDay()]})`; };
  const diff = s => Math.round((parse(s) - parse(todayISO)) / 86400000);
  const nextBiz = d => { let x = addDays(d, 1); while (x.getDay() === 0 || x.getDay() === 6) x = addDays(x, 1); return x; };
  const monday = d => addDays(d, -((d.getDay() + 6) % 7));
  const hhmm = s => (s && s.includes("T")) ? s.slice(11, 16) : "";
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- 업무 ----------
  const SERVER = MODE === "EDIT";
  // ---------- 시트 저장 (편집용 배포) ----------
  const run = (fn, ...args) => new Promise((ok, fail) => google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fn](...args));
  const errMsg = e => String(e && e.message || e).replace(/^Error:\s*/, "").replace(/^Exception:\s*/, "");
  function reload() {
    return run(READ_ONLY ? "getViewData" : "getData").then(d => {
      DATA.tasks = d.tasks; DATA.events = d.events; DATA.generatedAt = d.generatedAt; DATA.sheetUrl = d.sheetUrl;
      syncLabel(); renderAll();
    });
  }
  // 시트 쓰기는 한 건씩 차례로 (동시에 보내면 서버 잠금을 기다리느라 느려진다)
  let queue = Promise.resolve();
  function save(steps, okMsg, undo) {
    document.body.style.cursor = "progress";
    queue = queue.then(() => steps.reduce((p, f) => p.then(f), Promise.resolve()))
      .then(() => reload()).then(() => { if (okMsg) toast(okMsg, undo); })
      .catch(e => { toast("저장하지 못했습니다: " + errMsg(e)); return reload().catch(() => {}); })
      .finally(() => { document.body.style.cursor = ""; });
    return queue;
  }
  const findT = id => DATA.tasks.find(x => x.id === id);
  // 상태 저장: 화면에는 바로 반영하고, 시트에 저장한 뒤 최신 데이터로 다시 그린다
  function saveStatus(items, okMsg, undo) {
    items.forEach(it => { const t = findT(it.id); if (t) Object.assign(t, { status: it.status, doneAt: it.status === "done" ? stamp() : "" }); });
    renderAll();
    return save(items.map(it => () => {
      const t = findT(it.id); if (!t) return;
      return run("updateTask", t.id, t.version, { status: it.status }).then(() => { t.version = (t.version || 1) + 1; });
    }), okMsg, undo);
  }
  function tasks() {
    // 시트 상태(status)가 없던 예전 데이터는 done 값으로 맞춘다
    const base = DATA.tasks.map(t => Object.assign({}, t, { status: t.status || (t.done ? "done" : "todo") }));
    if (SERVER) return base;
    const gone = new Set(store.deleted);
    return base.concat(store.added).filter(t => !gone.has(t.id))
      .map(t => Object.assign({ status: "todo" }, t, store.overrides[t.id] || {}));
  }
  const isDone = t => t.status === "done";
  const isLate = t => !isDone(t) && t.due && t.due < todayISO;
  const colorOf = t => PCOLOR[PRODUCTS.find(p => (t.products || []).includes(p))] || "var(--p-none)";
  const hexOf = t => PHEX[PRODUCTS.find(p => (t.products || []).includes(p))] || "#8a94a6";
  const byDue = (a, b) => ((a.due || "9") + (a.time || "99")).localeCompare((b.due || "9") + (b.time || "99"));
  function update(id, fields) {
    const added = store.added.find(a => a.id === id);
    if (added) Object.assign(added, fields);
    else store.overrides[id] = Object.assign({}, store.overrides[id] || {}, fields);
    persist();
  }
  function setStatus(list, status, silent) {
    const prev = list.map(t => ({ id: t.id, status: t.status, doneAt: t.doneAt || "" }));
    if (SERVER) {
      selected.clear();
      const msg = silent ? "" : status === "done" ? `${list.length}건 완료 처리했습니다` : `${list.length}건을 '${STATUS[status]}'(으)로 바꿨습니다`;
      return saveStatus(list.map(t => ({ id: t.id, status })), msg, silent ? null : () => saveStatus(prev, "되돌렸습니다"));
    }
    list.forEach(t => update(t.id, { status, doneAt: status === "done" ? stamp() : "" }));
    selected.clear();
    renderAll();
    if (!silent) toast(status === "done" ? `${list.length}건 완료 처리했습니다` : `${list.length}건을 '${STATUS[status]}'(으)로 바꿨습니다`,
      () => { prev.forEach(p => update(p.id, { status: p.status, doneAt: p.doneAt })); renderAll(); });
  }

  // 담당자 문자열을 팀원에 연결 ("PM 전원"은 전원)
  const MEMBERS = DATA.members || [];
  function ownersOf(t) {
    const set = new Set();
    (t.assignees || []).forEach(a => {
      if (/전원/.test(a)) MEMBERS.forEach(m => set.add(m));
      MEMBERS.forEach(m => { if (a.includes(m)) set.add(m); });
    });
    return [...set];
  }
  const mine = t => !store.me || ownersOf(t).includes(store.me);
  const evOwners = e => { const m = (e.title || "").match(/^\[([^\]]+)\]/); return m ? MEMBERS.filter(x => m[1].includes(x)) : []; };

  // ---------- 화면 상태 ----------
  const state = { calCat: "all", calPerson: "", expand: {}, tab: "today", onlyMine: !!store.me, products: new Set(), calMode: "all", calView: "month", calCursor: parse(todayISO), weekCursor: monday(parse(todayISO)) };
  const selected = new Set();

  // ---------- 헤더 ----------
  const meSel = document.getElementById("me");
  meSel.innerHTML = `<option value="">전체 보기</option>` + MEMBERS.map(m => `<option${m === store.me ? " selected" : ""}>${esc(m)}</option>`).join("");
  meSel.onchange = () => { store.me = meSel.value; state.onlyMine = !!store.me; persist(); renderAll(); };
  function syncLabel() {
    document.getElementById("sync").innerHTML = `데이터 기준 <b>${esc(DATA.generatedAt || "-")}</b><br>${MODE === "RO" ? "열람 전용 · 상태는 이 브라우저에만 저장" : MODE === "EDIT" ? "시트와 연결됨 · 화면 갱신 " + stamp().slice(11) : "화면 갱신 " + stamp().slice(11)}`;
  }
  syncLabel();
  if (MODE === "RO") document.getElementById("addBtn").hidden = true;
  if (MODE !== "LOCAL") document.getElementById("mImport").closest("label").hidden = true;
  if (SERVER) document.getElementById("mReset").hidden = true;
  if (SERVER && DATA.sheetUrl) document.getElementById("mExport").insertAdjacentHTML("beforebegin", `<button id="mSheet">구글시트 열기</button><hr>`);
  const mSheet = document.getElementById("mSheet");
  if (mSheet) mSheet.onclick = () => { window.open(DATA.sheetUrl, "_blank", "noopener"); document.getElementById("menuDd").hidden = true; };
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
    state.tab = b.dataset.tab;
    document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
    ["today", "cal", "ppl", "brief"].forEach(v => document.getElementById("v-" + v).hidden = v !== state.tab);
    selected.clear(); renderAll();
  });
  document.getElementById("addBtn").onclick = () => openEdit(null, todayISO);
  const menuDd = document.getElementById("menuDd");
  document.getElementById("menuBtn").onclick = e => { e.stopPropagation(); menuDd.hidden = !menuDd.hidden; };
  document.addEventListener("click", () => menuDd.hidden = true);
  menuDd.onclick = e => e.stopPropagation();
  document.getElementById("mExport").onclick = () => {
    const out = Object.assign({}, DATA, { tasks: tasks(), exportedAt: stamp() });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: "application/json" }));
    a.download = `teamstar_gihan_${todayISO}.json`; a.click(); menuDd.hidden = true;
  };
  document.getElementById("mImport").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(txt => {
      const d = JSON.parse(txt);
      if (!Array.isArray(d.tasks)) throw new Error("tasks 항목이 없습니다");
      DATA.tasks = d.tasks; if (d.events) DATA.events = d.events; if (d.members) DATA.members = d.members;
      if (d.generatedAt) DATA.generatedAt = d.generatedAt;
      store.overrides = {}; store.added = []; store.deleted = []; persist();
      menuDd.hidden = true; renderAll(); toast(`업무 ${d.tasks.length}건을 불러왔습니다`);
    }).catch(err => toast("불러오지 못했습니다: " + err.message));
    e.target.value = "";
  };
  document.getElementById("mPastDone").onclick = () => {
    menuDd.hidden = true;
    const base = (DATA.generatedAt || todayISO).slice(0, 10);
    const list = tasks().filter(t => !isDone(t) && t.due && t.due < base);
    confirmBox(`${fmt(base)} 이전 마감 업무 ${list.length}건을 완료로 바꿀까요?`, "데이터 기준일 이전 업무는 이미 처리됐을 가능성이 높을 때 쓰세요. 되돌리기가 가능합니다.",
      () => setStatus(list, "done"));
  };
  document.getElementById("mReset").onclick = () => {
    menuDd.hidden = true;
    confirmBox("이 브라우저의 수정 내용을 모두 지울까요?", "완료 체크, 추가/수정/삭제한 업무가 모두 원래 데이터로 돌아갑니다.", () => {
      store = { overrides: {}, added: [], deleted: [], me: store.me }; persist(); renderAll();
    });
  };

  // ---------- 공통 조각 ----------
  function dueLabel(t) {
    if (!t.due) return `<span class="pill gray">마감일 없음</span>`;
    if (isDone(t)) return `<span class="pill done">✓ 완료</span>`;
    const n = diff(t.due);
    if (n < 0) return `<span class="pill late">지연 D+${-n}</span>`;
    if (n === 0) return `<span class="pill today">오늘 마감</span>`;
    return `<span class="pill soon">D-${n}</span>`;
  }
  function taskCard(t, opts = {}) {
    const el = document.createElement("div");
    el.className = "task" + (isLate(t) ? " late" : "") + (isDone(t) ? " done" : "") + (selected.has(t.id) ? " sel" : "");
    el.style.setProperty("--pc", colorOf(t));
    const prod = (t.products || []).join(", ");
    el.innerHTML = `
      <input type="checkbox" aria-label="선택" ${selected.has(t.id) ? "checked" : ""}>
      <div class="t-main">
        <div class="t-ttl">${esc(t.title)}</div>
        <div class="t-meta">${dueLabel(t)}
          ${t.due ? `<span>${fmt(t.due)}${t.time ? " " + esc(t.time) : ""}</span>` : ""}
          ${(t.assignees || []).length ? `<span class="who">${esc(t.assignees.join(", "))}</span>` : ""}
          ${prod ? `<span class="prod">${esc(prod)}</span>` : ""}
        </div>
      </div>
      <button class="status ${t.status}" title="눌러서 상태 변경 (대기 → 진행 중 → 완료)">${STATUS[t.status]}</button>`;
    el.querySelector("input").onchange = e => { e.target.checked ? selected.add(t.id) : selected.delete(t.id); renderAll(); };
    el.querySelector(".t-main").onclick = () => openTask(t);
    el.querySelector(".status").onclick = () => setStatus([t], NEXT[t.status], t.status !== "doing");
    return el;
  }
  function section(title, list, opts = {}) {
    const s = document.createElement("div"); s.className = "sec";
    s.innerHTML = `<h3 class="sec-h">${title}<span class="n">${list.length}건</span><span class="act"></span></h3><div class="tlist"></div>`;
    const box = s.querySelector(".tlist");
    if (!list.length) box.innerHTML = `<div class="empty">${opts.empty || "없음"}</div>`;
    const lim = opts.limit && !state.expand[opts.key] ? opts.limit : list.length;
    list.slice(0, lim).forEach(t => box.appendChild(taskCard(t)));
    if (list.length > lim) {
      const m = document.createElement("button"); m.className = "btn sm"; m.style.alignSelf = "flex-start";
      m.textContent = `${list.length - lim}건 더 보기`; m.onclick = () => { state.expand[opts.key] = true; renderAll(); };
      box.appendChild(m);
    } else if (opts.limit && list.length > opts.limit) {
      const m = document.createElement("button"); m.className = "btn sm ghost"; m.style.alignSelf = "flex-start";
      m.textContent = "접기"; m.onclick = () => { state.expand[opts.key] = false; renderAll(); };
      box.appendChild(m);
    }
    if (opts.selectAll && list.length) {
      const b = document.createElement("button"); b.className = "btn sm ghost"; b.textContent = "전체 선택";
      b.onclick = () => { list.forEach(t => selected.add(t.id)); renderAll(); };
      s.querySelector(".act").appendChild(b);
    }
    return s;
  }
  function filterBar(host) {
    const bar = document.createElement("div"); bar.className = "toolbar";
    bar.innerHTML = `<div class="chips" id="fp"></div><span class="grow"></span>` +
      (store.me ? `<label class="chips"><input type="checkbox" id="onlyMine" ${state.onlyMine ? "checked" : ""}> <span class="label-sm">${esc(store.me)} 업무만</span></label>` : `<span class="label-sm">오른쪽 위에서 내 이름을 고르면 내 업무만 볼 수 있어요</span>`);
    const fp = bar.querySelector("#fp");
    PRODUCTS.forEach(p => {
      const c = document.createElement("button");
      c.className = "chip" + (state.products.has(p) ? " on" : "");
      c.innerHTML = `<span class="dot" style="background:${PHEX[p]}"></span>${p === "기타" ? "기타 (클로아트, 리필펜)" : p}`;
      c.onclick = () => { state.products.has(p) ? state.products.delete(p) : state.products.add(p); renderAll(); };
      fp.appendChild(c);
    });
    const om = bar.querySelector("#onlyMine");
    if (om) om.onchange = () => { state.onlyMine = om.checked; renderAll(); };
    host.appendChild(bar);
  }
  const pass = t => (!state.products.size || (t.products || []).some(p => state.products.has(p))) && (!state.onlyMine || mine(t));

  // ---------- 오늘 ----------
  function renderToday() {
    const v = document.getElementById("v-today"); v.innerHTML = "";
    const all = tasks();
    const L = all.filter(pass);
    const late = L.filter(isLate).sort(byDue);
    const tdy = L.filter(t => !isDone(t) && t.due === todayISO).sort(byDue);
    const nb = iso(nextBiz(parse(todayISO)));
    const tmr = L.filter(t => !isDone(t) && t.due > todayISO && t.due <= nb).sort(byDue);
    const wkStart = iso(monday(parse(todayISO))), wkEnd = iso(addDays(monday(parse(todayISO)), 6));
    const rest = L.filter(t => !isDone(t) && t.due > nb && t.due <= wkEnd).sort(byDue);
    const later = L.filter(t => !isDone(t) && t.due > wkEnd && diff(t.due) <= 14).sort(byDue);
    const undated = L.filter(t => !isDone(t) && !t.due);
    const wk = L.filter(t => t.due && t.due >= wkStart && t.due <= wkEnd);
    const wkDone = wk.filter(isDone).length;
    const rate = wk.length ? Math.round(wkDone / wk.length * 100) : 0;

    const k = document.createElement("div"); k.className = "kpis";
    k.innerHTML = `
      <div class="card kpi" style="--k:${late.length ? "var(--late)" : "var(--done)"}"><div class="k-l">지연</div>
        <div class="k-v">${late.length ? late.length + "<small>건</small>" : "없음"}</div><div class="k-s">${late.length ? "마감일이 지났고 완료 안 됨" : "밀린 업무가 없습니다"}</div></div>
      <div class="card kpi" style="--k:var(--coral)"><div class="k-l">오늘 마감</div>
        <div class="k-v">${tdy.length}<small>건</small></div><div class="k-s">${fmt(todayISO)}</div></div>
      <div class="card kpi" style="--k:var(--navy)"><div class="k-l">이번 주 남은 업무</div>
        <div class="k-v">${wk.filter(t => !isDone(t) && t.due >= todayISO).length}<small>건</small></div><div class="k-s">${fmt(wkStart)} ~ ${fmt(wkEnd)}</div></div>
      <div class="card kpi" style="--k:var(--teal)"><div class="k-l">이번 주 완료율</div>
        <div class="k-v">${rate}<small>%</small></div><div class="bar"><i style="width:${rate}%"></i></div><div class="k-s">${wkDone} / ${wk.length}건 완료</div></div>`;
    v.appendChild(k);
    filterBar(v);

    const g = document.createElement("div"); g.className = "today-grid";
    const left = document.createElement("div");
    left.appendChild(section(`<span class="pill late">지연</span>먼저 처리할 업무`, late, { selectAll: true, limit: 6, key: "late", empty: "지연된 업무가 없습니다 👍" }));
    left.appendChild(section(`<span class="pill today">오늘</span>${fmt(todayISO)} 마감`, tdy, { selectAll: true, empty: "오늘 마감 업무가 없습니다" }));
    left.appendChild(section(`<span class="pill soon">다음 영업일</span>${fmt(nb)} 마감`, tmr, { empty: "없음" }));
    left.appendChild(section(`이번 주 남은 업무`, rest, { empty: "없음" }));
    if (later.length) left.appendChild(section(`다음 2주 안`, later));
    if (undated.length) left.appendChild(section(`마감일 없는 업무`, undated));
    g.appendChild(left);

    const side = document.createElement("div"); side.className = "side";
    const evs = (DATA.events || []).filter(e => e.start.slice(0, 10) <= todayISO && (e.lastDay || e.start.slice(0, 10)) >= todayISO)
      .filter(e => !state.onlyMine || !evOwners(e).length || evOwners(e).includes(store.me))
      .sort((a, b) => (a.allDay ? "0" : hhmm(a.start)).localeCompare(b.allDay ? "0" : hhmm(b.start)));
    const ec = document.createElement("div"); ec.className = "card";
    ec.innerHTML = `<h2>오늘 Team STAR 일정 <span class="pill event">${evs.length}건</span></h2>` +
      (evs.length ? evs.map((e, i) => `<div class="ev" data-i="${i}"><span class="tm">${e.allDay ? "종일" : hhmm(e.start)}</span><span>${esc(e.title)}</span></div>`).join("") : `<div class="empty">오늘 등록된 일정이 없습니다</div>`);
    ec.querySelectorAll(".ev").forEach(x => { x.style.cursor = "pointer"; x.onclick = () => openEvent(evs[+x.dataset.i]); });
    side.appendChild(ec);
    const dn = all.filter(isDone).sort((a, b) => (b.doneAt || "").localeCompare(a.doneAt || "")).slice(0, 8);
    const dc = document.createElement("div"); dc.className = "card";
    dc.innerHTML = `<h2>최근 완료 <span class="pill done">${all.filter(isDone).length}건</span></h2>` +
      (dn.length ? dn.map((t, i) => `<div class="mini"><span class="ttl" title="${esc(t.title)}">${esc(t.title)}</span><button class="btn sm" data-i="${i}">되돌리기</button></div>`).join("") : `<div class="empty">아직 완료한 업무가 없습니다</div>`);
    dc.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => setStatus([dn[+b.dataset.i]], "todo"));
    side.appendChild(dc);
    const hc = document.createElement("div"); hc.className = "card";
    hc.innerHTML = `<h2>사용법</h2><div class="label-sm" style="font-weight:500;line-height:1.7">
      상태 버튼을 누르면 <b>대기 → 진행 중 → 완료</b>로 바뀝니다.<br>왼쪽 체크박스로 여러 건을 골라 한 번에 완료할 수 있어요.<br>
      완료한 업무는 오늘 화면과 마감 달력에서 빠지고, 캘린더 <b>통합</b> 보기에만 남습니다.<br>
      ${MODE === "EDIT" ? "바꾼 내용은 구글시트에 저장되어 팀 전체에 보입니다." : "바꾼 내용은 이 브라우저에만 저장됩니다. 팀 공유는 편집용 주소에서 해 주세요."}</div>`;
    side.appendChild(hc);
    g.appendChild(side);
    v.appendChild(g);
  }

  // ---------- 캘린더 ----------
  const CATS = [["all", "전체", "#01335f"], ["복합제", "복합제", "#e95f55"], ["크레스토", "크레스토", "#2f5ba8"], ["기타", "기타 (클로아트, 리필펜)", "#009b9e"], ["개인", "개인", "#8a5cc7"]];
  const isPersonalEv = e => evOwners(e).length > 0 || /휴가|연차|반차|스마트워크|재택|근무일|외근|출장/.test(e.title || "");
  function catBar(host) {
    const bar = document.createElement("div"); bar.className = "catbar";
    const who = state.calPerson || "전체";
    bar.innerHTML = CATS.map(([k, lab, col]) => `<button class="cat${state.calCat === k ? " on" : ""}" data-c="${k}" style="--cc:${col}">${k === "all" ? "" : `<span class="dot"></span>`}${lab}</button>`).join("") +
      (state.calCat === "개인" ? `<select class="sel sm" id="cpw"><option value="전체"${who === "전체" ? " selected" : ""}>전체 팀원</option>${MEMBERS.map(m => `<option${m === who ? " selected" : ""}>${esc(m)}</option>`).join("")}</select><span class="label-sm">${who === "전체" ? "팀원 개인 일정 전체 (심포지엄, 휴가, 스마트워크, 외부일정 등)" : esc(who) + "님의 업무와 개인 일정"}</span>` : "");
    bar.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { state.calCat = b.dataset.c; renderAll(); });
    const sel = bar.querySelector("#cpw"); if (sel) sel.onchange = () => { state.calPerson = sel.value; renderAll(); };
    host.appendChild(bar);
  }
  function renderCal() {
    const v = document.getElementById("v-cal"); v.innerHTML = "";
    const tb = document.createElement("div"); tb.className = "toolbar";
    tb.innerHTML = `
      <div class="seg" id="cm"><button data-m="all">통합</button><button data-m="tasks">마감</button><button data-m="events">일정</button></div>
      <div class="cal-head"><button class="btn sm" id="cp">‹</button><div class="lbl" id="cl"></div><button class="btn sm" id="cn">›</button><button class="btn sm" id="ct">오늘</button></div>
      <div class="seg" id="cv"><button data-v="month">월간</button><button data-v="week">주간</button></div>
      <span class="grow"></span>
      <div class="legend"><span><i style="background:#fff;box-shadow:inset 0 0 0 1.5px var(--late)"></i>지연</span><span><i style="background:var(--done-soft)"></i>완료</span><span><i style="background:var(--event-bg)"></i>Team STAR 일정</span></div>`;
    v.appendChild(tb);
    tb.querySelectorAll("#cm button").forEach(b => { b.classList.toggle("on", b.dataset.m === state.calMode); b.onclick = () => { state.calMode = b.dataset.m; renderAll(); }; });
    tb.querySelectorAll("#cv button").forEach(b => { b.classList.toggle("on", b.dataset.v === state.calView); b.onclick = () => { state.calView = b.dataset.v; renderAll(); }; });
    const c = state.calCursor;
    tb.querySelector("#cp").onclick = () => { state.calCursor = state.calView === "month" ? new Date(c.getFullYear(), c.getMonth() - 1, 1) : addDays(c, -7); renderAll(); };
    tb.querySelector("#cn").onclick = () => { state.calCursor = state.calView === "month" ? new Date(c.getFullYear(), c.getMonth() + 1, 1) : addDays(c, 7); renderAll(); };
    tb.querySelector("#ct").onclick = () => { state.calCursor = parse(todayISO); renderAll(); };
    catBar(v);
    const who = state.calPerson || "전체";
    const tPass = t => state.calCat === "all" ? true : state.calCat === "개인" ? (who !== "전체" && ownersOf(t).includes(who)) : (t.products || []).includes(state.calCat);
    const ePass = e => state.calCat === "all" ? true : state.calCat === "개인" ? (who === "전체" ? isPersonalEv(e) : evOwners(e).includes(who)) : (e.cat || []).includes(state.calCat);
    const T = state.calMode === "events" ? [] : tasks().filter(tPass).filter(t => t.due && (state.calMode === "all" || !isDone(t)));
    const E = state.calMode === "tasks" ? [] : (DATA.events || []).filter(ePass);
    const itemsOn = d => T.filter(t => t.due === d).sort(byDue).map(t => ({ t }))
      .concat(E.filter(e => e.start.slice(0, 10) <= d && (e.lastDay || e.start.slice(0, 10)) >= d).sort((a, b) => (a.allDay ? "0" : hhmm(a.start)).localeCompare(b.allDay ? "0" : hhmm(b.start))).map(e => ({ e })));
    const btn = it => {
      const b = document.createElement("button");
      if (it.t) {
        const t = it.t;
        b.className = "item task-i" + (isDone(t) ? " done" : isLate(t) ? " late" : "");
        b.style.setProperty("--pc", colorOf(t));
        b.innerHTML = `${isDone(t) ? "✓ " : isLate(t) ? "! " : ""}${t.time ? `<span class="t">${esc(t.time)}</span>` : ""}${esc(t.title)}`;
        b.title = t.title; b.onclick = ev => { ev.stopPropagation(); openTask(t); };
      } else {
        const e = it.e;
        b.className = "item ev-i";
        b.innerHTML = `${e.allDay ? "" : `<span class="t">${hhmm(e.start)}</span>`}${esc(e.title)}`;
        b.title = e.title; b.onclick = ev => { ev.stopPropagation(); openEvent(e); };
      }
      return b;
    };
    const cal = document.createElement("div"); cal.className = "card cal";
    if (state.calView === "month") {
      tb.querySelector("#cl").textContent = `${c.getFullYear()}년 ${c.getMonth() + 1}월`;
      cal.innerHTML = `<div class="dow">${DOW.map(d => `<div>${d}</div>`).join("")}</div>`;
      const grid = document.createElement("div"); grid.className = "grid";
      const first = new Date(c.getFullYear(), c.getMonth(), 1);
      let d = addDays(first, -first.getDay());
      const maxShow = innerWidth < 640 ? 6 : 4;
      for (let i = 0; i < 42; i++, d = addDays(d, 1)) {
        if (i === 35 && d.getMonth() !== c.getMonth()) break;
        const di = iso(d), cell = document.createElement("div");
        cell.className = "day" + (d.getMonth() !== c.getMonth() ? " out" : "") + (di === todayISO ? " today" : "") + (d.getDay() === 0 ? " sun" : d.getDay() === 6 ? " sat" : "");
        cell.innerHTML = `<span class="num">${d.getDate()}</span>`;
        const its = itemsOn(di);
        its.slice(0, maxShow).forEach(it => cell.appendChild(btn(it)));
        if (its.length > maxShow) cell.insertAdjacentHTML("beforeend", `<div class="more">+${its.length - maxShow}개 더</div>`);
        cell.onclick = () => openDay(di, itemsOn(di), btn);
        grid.appendChild(cell);
      }
      cal.appendChild(grid);
    } else {
      const s = addDays(c, -c.getDay());
      tb.querySelector("#cl").textContent = `${s.getMonth() + 1}/${s.getDate()} – ${addDays(s, 6).getMonth() + 1}/${addDays(s, 6).getDate()}`;
      const wk = document.createElement("div"); wk.className = "week";
      for (let i = 0; i < 7; i++) {
        const d = addDays(s, i), di = iso(d);
        const col = document.createElement("div"); col.className = "col" + (di === todayISO ? " today" : "");
        col.innerHTML = `<div class="hd"><b>${d.getDate()}</b>${DOW[d.getDay()]}</div>`;
        itemsOn(di).forEach(it => col.appendChild(btn(it)));
        wk.appendChild(col);
      }
      cal.appendChild(wk);
    }
    v.appendChild(cal);
  }

  // ---------- 개인별 ----------
  function renderPpl() {
    const v = document.getElementById("v-ppl"); v.innerHTML = "";
    const ws = state.weekCursor, we = addDays(ws, 6);
    const tb = document.createElement("div"); tb.className = "toolbar";
    tb.innerHTML = `<button class="btn sm" id="pp">‹ 이전 주</button><div class="cal-head"><div class="lbl">${fmt(iso(ws))} – ${fmt(iso(addDays(ws, 4)))}</div></div>
      <button class="btn sm" id="pn">다음 주 ›</button><button class="btn sm" id="pt">이번 주</button><span class="grow"></span>

  // ---------- 아침 브리핑 ----------
  const LIMIT_CH = 400, LIMIT_NL = 29;
  function briefData(baseISO) {
    const T = tasks().filter(t => !isDone(t));
    const nb = iso(nextBiz(parse(baseISO)));
    return {
      base: baseISO, nb,
      late: T.filter(t => t.due && t.due < baseISO).sort(byDue),
      today: T.filter(t => t.due === baseISO).sort(byDue),
      next: T.filter(t => t.due > baseISO && t.due <= nb).sort(byDue),
      week: parse(baseISO).getDay() === 1 ? T.filter(t => t.due > nb && t.due <= iso(addDays(parse(baseISO), 6))).sort(byDue) : [],
    };
  }
  const short = s => s.replace(/\s*\([^)]*\)\s*/g, " ").replace(/\s+/g, " ").trim();
  function briefText(b, cap) {
    const line = t => `- ${t.time ? t.time + " " : ""}${short(t.title)}${(t.assignees || []).length ? " / " + t.assignees.map(a => a.replace(/\s*\(.*\)/, "")).join(",") : ""}`;
    const blk = (head, list) => !list.length ? [] : [head].concat(list.slice(0, cap).map(line)).concat(list.length > cap ? [`- 외 ${list.length - cap}건`] : []);
    const out = [`[★스타팀 기한이] ${fmt(b.base)} 아침 브리핑`, ""];
    const parts = [
      blk(`🔴 지연 ${b.late.length}건`, b.late),
      blk(`🟠 오늘 ${fmt(b.base)} ${b.today.length}건`, b.today),
      blk(`🟢 ${fmt(b.nb)} ${b.next.length}건`, b.next),
      blk(`📅 이번 주 남은 업무 ${b.week.length}건`, b.week),
    ].filter(p => p.length);
    if (!parts.length) out.push("오늘은 지연, 마감 업무가 없습니다. 좋은 하루 보내세요 ★");
    parts.forEach((p, i) => { if (i) out.push(""); out.push(...p); });
    return out.join("\n");
  }
  function fitText(b) {
    for (let cap = 8; cap >= 1; cap--) {
      const t = briefText(b, cap);
      if (t.length <= LIMIT_CH && (t.match(/\n/g) || []).length <= LIMIT_NL) return { text: t, cap };
    }
    return { text: briefText(b, 1), cap: 1 };
  }
  function drawBrief(canvas, b) {
    const W = 800, rows = [["지연", b.late, "#c8362a"], ["오늘", b.today, "#e95f55"], [fmt(b.nb), b.next, "#009b9e"]];
    const F = '"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    // 1차: 높이 계산, 2차: 그리기
    function paint(g) {
      let y = 168;
      rows.forEach(([lab, list, col], i) => {
        if (g) {
          g.fillStyle = col; roundRect(g, 32, y, 160, 54, 27); g.fill();
          g.fillStyle = "#fff"; g.font = `800 30px ${F}`; g.textAlign = "center"; g.fillText(lab, 112, y + 38); g.textAlign = "left";
          g.fillStyle = col; g.font = `800 46px ${F}`; g.fillText(`${list.length}건`, 214, y + 44);
        }
        y += 54 + 18;
        const show = list.slice(0, 2);
        if (!list.length) { if (g) { g.fillStyle = "#8a94a6"; g.font = `600 28px ${F}`; g.fillText("없음", 64, y + 28); } y += 44; }
        show.forEach(t => {
          if (g) {
            g.fillStyle = hexOf(t); g.beginPath(); g.arc(46, y + 19, 7, 0, 7); g.fill();
            g.fillStyle = "#13213a"; g.font = `600 30px ${F}`;
            const full = (t.time ? t.time + " " : "") + short(t.title); let s = full;
            while (g.measureText(s + "…").width > W - 100 && s.length > 4) s = s.slice(0, -1);
            g.fillText(s === full ? s : s + "…", 64, y + 30);
          }
          y += 48;
        });
        if (list.length > 2) { if (g) { g.fillStyle = "#687489"; g.font = `600 24px ${F}`; g.fillText(`외 ${list.length - 2}건`, 64, y + 22); } y += 36; }
        y += 18;
        if (i < rows.length - 1) { if (g) { g.fillStyle = "#e7e2d4"; g.fillRect(32, y - 2, W - 64, 2); } y += 22; }
      });
      return y + 70;
    }
    const H = paint(null);
    canvas.width = W; canvas.height = H;
    const g = canvas.getContext("2d");
    g.fillStyle = "#fffdf8"; g.fillRect(0, 0, W, H);
    g.fillStyle = "#01335f"; g.fillRect(0, 0, W, 132);
    ["#01335f", "#009b9e", "#e95f55", "#009b9e"].forEach((c, i) => { g.fillStyle = c; g.fillRect(i * W / 4, 132, W / 4, 8); });
    g.fillStyle = "#7fe0e2"; g.font = `700 28px ${F}`; g.fillText("TEAM STAR 기한이", 36, 54);
    g.fillStyle = "#fff"; g.font = `800 44px ${F}`; g.fillText(`${fmt(b.base)} 아침 브리핑`, 36, 108);
    paint(g);
    g.fillStyle = "#01335f"; g.fillRect(0, H - 64, W, 64);
    g.fillStyle = "#fff"; g.font = `700 26px ${F}`; g.fillText("상세 내용은 다음 메시지에서 확인 ▼", 36, H - 22);
  }
  function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  function renderBrief() {

        </div>
        <div class="phone2">
          <div class="bubble"><div class="bh"><span class="no">1</span><img src="${LOGO_STAR}" alt="">TEAM STAR_기한이 · 이미지 (푸시 없음)</div><canvas id="bc"></canvas>
            <pre>[★스타팀 기한이] ${fmt(b.base)} 업무기한 요약표입니다.</pre></div>
          <div class="bubble"><div class="bh"><span class="no">2</span><img src="${LOGO_STAR}" alt="">TEAM STAR_기한이 · 텍스트 (푸시 있음)</div><pre id="bp"></pre></div>
        </div>

    drawBrief(v.querySelector("#bc"), b);

    v.querySelector("#bcopy").onclick = () => {
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast("텍스트를 복사했습니다"))
        .catch(() => { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("텍스트를 복사했습니다"); });
    };
    v.querySelector("#bimg").onclick = () => {
      const a = document.createElement("a"); a.href = v.querySelector("#bc").toDataURL("image/png");
      a.download = `기한이_브리핑_${b.base}.png`; a.click();
    };
  }

  // ---------- 팝업 ----------
  const modal = document.getElementById("modal"), sheet = document.getElementById("sheet");
  function openModal(html) { sheet.innerHTML = `<button class="x" aria-label="닫기">×</button>` + html; modal.classList.add("open"); sheet.querySelector(".x").onclick = closeModal; }
